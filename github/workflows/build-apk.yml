name: Build MgLoot APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build PWA to APK
      uses: pwa-builder/pwabuilder-action@v1
      with:
        url: https://mgloot.com
        name: MgLoot
        packageId: com.mgloot.app
        output: android
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Mgloot-App
        path: app-release.apk
